# Python 安装、运行依赖和 EXE 构建工具配置。
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodl-gpu-watcher"
dynamic = ["version"]
description = "Auto compute and training scheduler"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "playwright>=1.45,<2",
  "requests>=2.32,<3",
  "Pillow>=12.0,<13",
]

[project.scripts]
autodl-watcher = "autodl_watcher.launcher:gui_main"
autodl-watcher-monitor = "autodl_watcher.launcher:monitor_main"

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]

[tool.setuptools.dynamic]
version = {attr = "autodl_watcher.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autodl_watcher = ["default.ico", "defaults.yaml", "remote_probe.py"]
