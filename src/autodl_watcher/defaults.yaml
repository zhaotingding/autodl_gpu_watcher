# ═══════════════════════════════════════════════════════════════
# AutoDL GPU Watcher — 配置文件
# ═══════════════════════════════════════════════════════════════

# ── 监控循环参数 ──
# poll_seconds:       每轮循环间隔（秒）
# confirmation_seconds: GPU 需连续达标多少秒后才触发（0=立即触发）
# min_idle_samples:    最少需要的连续空闲采样数
# max_sample_gap_seconds: 连续采样之间允许的最大时间间隔（超出则重置）
# stale_after_seconds: 采样超过此秒数视为过期
# reset_busy_samples:  连续忙碌多少次后重置告警状态
monitor:
  poll_seconds: 60
  confirmation_seconds: 0
  min_idle_samples: 1
  max_sample_gap_seconds: 120
  stale_after_seconds: 90
  reset_busy_samples: 1

# ── GPU 空闲判定阈值 ──
# gpu_util_check_enabled: 是否启用 GPU Util 硬门控（false=仅记录）
# gpu_util_max_pct:       GPU Util 上限（启用时生效）
# memory_free_min_mb:     最低可用显存（MB）
# memory_free_min_ratio:  最低可用显存比例（相对于总显存）
# 最终门槛 = max(memory_free_min_mb, 总显存 x memory_free_min_ratio)
idle_thresholds:
  # GPU Util 只记录，不参与拦截。
  gpu_util_check_enabled: false
  gpu_util_max_pct: 100
  # 可用显存 >= max(8192 MB, 总显存的 25%)。
  memory_free_min_mb: 8192
  memory_free_min_ratio: 0.25

platform:
  page_url: "https://private.autodl.com/console/machine"
  api_path_contains: "/api/v2/machine/list"
  api_base_url: "https://private.autodl.com"
  browser_channel: "msedge"
  user_data_dir: "runtime/browser_profile"
  headless: true
  response_timeout_seconds: 20
  # v0.5.2：主机列表 API 瞬时超时只重试，不再误判为登录失效。
  max_attempts: 2
  retry_delay_seconds: 2
  # v0.5.4：AutoDL 控制面优先直连，绕过 Windows/Clash 系统代理。
  # 这只影响 watcher 自己的登录 Edge/后台 Edge；Telemetry 仍可走 HTTP_PROXY。
  autodl_direct: true
  proxy_bypass_list: "private.autodl.com;*.autodl.com;<local>"
  # 同一物理主机可能有多个登录入口；取各入口 idle 的最大值，不相加。
  # gpu.idle/gpu.total 表示平台视角下可分配 GPU ID 数/总 GPU ID 数。
  # 直接 SSH 任务可能未被平台计入，所以最终仍以资源监控页的 GPU INDEX 显存为准。
  aggregation: "max"

telemetry:
  endpoint: ""  # 填写自己的兼容 GPU Telemetry 服务地址；不使用作者的私有服务。
  # 单次最多等 20 秒；第一次超时/断连/429/5xx 后，隔 2 秒重试一次。
  timeout_seconds: 20
  max_attempts: 2
  retry_delay_seconds: 2
  only_online: true

auto_start:
  # 默认仅监控；填写自己的实例映射并在界面明确启用后才允许电源操作。
  enabled: false
  default_host: "gpu-1"
  dry_run: true
  verify_before_start: true
  recheck_delay_seconds: 1
  post_start_check_seconds: 5
  max_starts_per_event: 1
  targets: []

occupancy:
  # 本人在“查看占用”弹窗中的用户标识；用于识别“已经成功开机”状态。
  self_user: ""
  # v0.5.4：一次空弹窗不再判定本人已关机；必须连续两次可靠空快照。
  absent_confirmations_required: 2

notification:
  console_enabled: true
  email_enabled: false
  subject_prefix: "[AutoDL 开机达标]"

runtime:
  state_file: "runtime/state.json"
  log_file: "runtime/logs/watcher.log"
