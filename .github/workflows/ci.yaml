name: Offline checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable source
        run: python -m pip install -e .
      - name: Offline tests without personal settings
        run: python -m unittest discover -s tests -q
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
      - name: Install wheel in a separate environment
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv "$env:RUNNER_TEMP/wheel-env"
          $python = "$env:RUNNER_TEMP/wheel-env/Scripts/python.exe"
          & $python -m pip install (Get-ChildItem dist/autodl_gpu_watcher-*.whl | Select-Object -First 1).FullName
          $env:AUTODL_APP_ROOT = "$env:RUNNER_TEMP/wheel-data"
          Set-Location $env:RUNNER_TEMP
          & $python -m autodl_watcher --version
          & $python -c "from autodl_watcher.paths import prepare_application, default_config_path; from autodl_watcher.config import load_config; prepare_application(); c=load_config(default_config_path()); assert not c.auto_start.enabled and not c.auto_start.targets"
          & $python -m pip check
